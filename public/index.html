<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hocine Chapati</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0f0f0f;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
.logo{font-size:64px;margin-bottom:8px}
h1{font-size:32px;font-weight:900;margin-bottom:8px;text-align:center}
.sub{color:#888;font-size:15px;margin-bottom:40px;text-align:center}
.choices{display:flex;flex-direction:column;gap:16px;width:100%;max-width:420px}
.choice{background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:20px;padding:26px 24px;text-decoration:none;color:#fff;display:flex;align-items:center;gap:18px;transition:.2s;cursor:pointer}
.choice:hover{border-color:#22c55e;background:#111;transform:translateY(-2px)}
.choice .icon{font-size:40px;flex-shrink:0}
.choice .content{flex:1;text-align:left}
.choice .title{font-size:19px;font-weight:800;margin-bottom:4px}
.choice .desc{font-size:13px;color:#888}
.choice .arrow{font-size:22px;color:#22c55e;flex-shrink:0}
.footer{margin-top:40px;font-size:12px;color:#444;text-align:center;line-height:1.6}
.footer b{color:#22c55e}
.redirecting{color:#666;font-size:14px;margin-top:20px}
.spinner{width:28px;height:28px;border:3px solid #222;border-top-color:#22c55e;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="logo">🍔</div>
<h1>Hocine Chapati</h1>
<p class="sub">Choisissez votre affichage</p>

<div class="choices" id="choices">
  <a href="affichage.html" class="choice">
    <div class="icon">📺</div>
    <div class="content">
      <div class="title">Affichage TV</div>
      <div class="desc">Écran client — commandes prêtes</div>
    </div>
    <div class="arrow">→</div>
  </a>
  <a href="passe.html" class="choice">
    <div class="icon">📱</div>
    <div class="content">
      <div class="title">Passe cuisine</div>
      <div class="desc">Tablette — gestion des tickets</div>
    </div>
    <div class="arrow">→</div>
  </a>
</div>

<div class="footer">
  Astuce : accédez directement à <b>/affichage</b> ou <b>/passe</b><br>
  pour éviter cet écran sur vos appareils dédiés.
</div>

<div id="autoRedirect" style="display:none;text-align:center">
  <div class="spinner"></div>
  <div class="redirecting" id="redirectMsg">Redirection…</div>
</div>

<script>
// Détection automatique UNIQUEMENT si l'utilisateur vient d'une URL courte
// et si aucun paramètre "menu" n'est présent
const urlParams = new URLSearchParams(window.location.search);
const forceMenu = urlParams.has('menu');

if (!forceMenu) {
  // Détection de l'appareil
  const width = window.innerWidth;
  const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  const isTablet = /iPad|Tablet|Android/i.test(navigator.userAgent) && width >= 600 && width < 1200;
  const isTV = width >= 1024 && !isMobile && !isTablet;
  
  // Si TV (écran large sans mobile), on redirige vers affichage
  if (isTV) {
    document.getElementById('choices').style.display = 'none';
    document.getElementById('autoRedirect').style.display = 'block';
    document.getElementById('redirectMsg').textContent = 'Redirection vers l\'affichage TV…';
    setTimeout(() => {
      window.location.replace('affichage.html');
    }, 400);
  }
  // Si mobile/tablette, on redirige vers passe
  else if (isMobile || isTablet) {
    document.getElementById('choices').style.display = 'none';
    document.getElementById('autoRedirect').style.display = 'block';
    document.getElementById('redirectMsg').textContent = 'Redirection vers le passe…';
    setTimeout(() => {
      window.location.replace('passe.html');
    }, 400);
  }
  // Sinon (desktop ambigu), on affiche le menu
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Musique - Hocine Chapati</title>
<meta name="theme-color" content="#111111">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#111;color:#fff;min-height:100vh;padding:24px}
h1{font-size:22px;font-weight:900;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:#888;font-size:13px;margin-bottom:24px}
.card{background:#1a1a1a;border-radius:18px;padding:20px;margin-bottom:16px;border:1.5px solid #2a2a2a}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:#888;margin-bottom:14px;font-weight:800}
.card input{width:100%;padding:16px;border-radius:12px;background:#0a0a0a;border:2px solid #2a2a2a;color:#fff;font-size:15px;font-family:'Inter',sans-serif;outline:none;margin-bottom:12px}
.card input:focus{border-color:#22c55e}
.card button{width:100%;padding:16px;border-radius:12px;background:#22c55e;color:#fff;border:none;font-weight:800;font-size:15px;cursor:pointer;font-family:'Inter',sans-serif}
.card button:active{background:#16a34a;transform:scale(.98)}
.card button.secondary{background:#2a2a2a;margin-top:8px}
.card button.secondary:active{background:#333}
.current{background:#0a0a0a;border-radius:12px;padding:14px;margin-bottom:14px;font-size:13px}
.current .label{color:#888;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-weight:700}
.current .value{font-family:monospace;color:#22c55e;word-break:break-all;font-size:12px}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.quick button{padding:14px;border-radius:12px;background:#0a0a0a;border:1.5px solid #2a2a2a;color:#fff;font-weight:700;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif}
.quick button:active{background:#22c55e;border-color:#22c55e}
.quick button.danger:active{background:#ef4444;border-color:#ef4444}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#22c55e;color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;font-weight:700;z-index:100;box-shadow:0 8px 24px rgba(34,197,94,.3);opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
.status{text-align:center;font-size:12px;color:#22c55e;margin-bottom:20px;font-weight:700}
.status.offline{color:#ef4444}
</style>
</head>
<body>

<h1>🎵 Musique & Live</h1>
<p class="sub">Controle ce qui joue sur la TV</p>

<div class="status" id="status">● Connecte</div>

<div class="card">
  <h2>En ce moment sur la TV</h2>
  <div class="current">
    <div class="label">Video ID</div>
    <div class="value" id="currentId">--</div>
  </div>
</div>

<div class="card">
  <h2>Changer la video</h2>
  <input type="text" id="urlInput" placeholder="Colle un lien YouTube ici..." value="">
  <button onclick="changeVideo()">Changer sur la TV</button>
</div>

<div class="card">
  <h2>Raccourcis</h2>
  <div class="quick">
    <button onclick="reloadIframe()">🔄 Recharger</button>
    <button onclick="muteIframe()">🔇 Muet</button>
    <button onclick="unmuteIframe()">🔊 Son</button>
    <button class="danger" onclick="hideIframe()">❌ Masquer</button>
    <button onclick="showIframe()" style="grid-column:span 2">👁 Afficher</button>
  </div>
</div>

<div class="toast" id="toast">OK</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({ reconnection: true, reconnectionAttempts: Infinity });
let currentVideoId = '';

socket.on('connect', () => {
  document.getElementById('status').textContent = '● Connecte';
  document.getElementById('status').className = 'status';
  socket.emit('music:request-state');
});

socket.on('disconnect', () => {
  document.getElementById('status').textContent = '● Hors ligne';
  document.getElementById('status').className = 'status offline';
});

socket.on('music:state', (state) => {
  if (state && state.videoId) {
    currentVideoId = state.videoId;
    document.getElementById('currentId').textContent = state.videoId;
    document.getElementById('urlInput').value = 'https://www.youtube.com/watch?v=' + state.videoId;
  }
});

socket.on('music:video-changed', (state) => {
  if (state && state.videoId) {
    currentVideoId = state.videoId;
    document.getElementById('currentId').textContent = state.videoId;
    showToast('Video mise a jour');
  }
});

function extractYoutubeId(input) {
  input = input.trim();
  // Deja un ID (11 caracteres)
  if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input;
  // URL with watch?v=
  let m = input.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // URL live
  m = input.match(/\/live\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // URL embed
  m = input.match(/\/embed\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  // URL youtu.be
  m = input.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
  if (m) return m[1];
  return null;
}

function changeVideo() {
  const input = document.getElementById('urlInput').value;
  const id = extractYoutubeId(input);
  if (!id) {
    showToast('Lien invalide', true);
    return;
  }
  socket.emit('music:set-video', { videoId: id });
  currentVideoId = id;
  document.getElementById('currentId').textContent = id;
  showToast('Video changee sur la TV');
}

function reloadIframe() { socket.emit('music:action', { action: 'reload' }); showToast('Rechargement'); }
function muteIframe() { socket.emit('music:action', { action: 'mute' }); showToast('Muet'); }
function unmuteIframe() { socket.emit('music:action', { action: 'unmute' }); showToast('Son active'); }
function hideIframe() { socket.emit('music:action', { action: 'hide' }); showToast('Masque'); }
function showIframe() { socket.emit('music:action', { action: 'show' }); showToast('Affiche'); }

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#ef4444' : '#22c55e';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
</script>
</body>
</html>

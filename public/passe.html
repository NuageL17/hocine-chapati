<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Passe - Hocine Chapati</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#111111">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Inter',sans-serif;background:#f5f5f7;color:#111;min-height:100vh;overflow-x:hidden}
.hidden{display:none !important}
.pairing{padding:30px 20px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh;justify-content:center}
.pairing h1{font-size:28px;font-weight:900;text-align:center;margin-bottom:6px}
.pairing p{color:#888;text-align:center;margin-bottom:24px;font-size:15px}
.code-boxes{display:flex;gap:12px;justify-content:center;margin-bottom:20px}
.code-box{width:70px;height:96px;background:#fff;border:2px solid #e5e5e5;border-radius:16px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:44px;color:#111;transition:.15s}
.code-box.active{border-color:#22c55e}
.code-box.filled{border-color:#22c55e;background:#f0fdf4;color:#22c55e}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.numpad button{background:#fff;border:1.5px solid #e5e5e5;border-radius:18px;padding:22px 0;font-size:32px;font-weight:800;font-family:'JetBrains Mono',monospace;cursor:pointer;transition:.1s;color:#111;user-select:none}
.numpad button:active{background:#111;color:#fff;transform:scale(.96)}
.numpad button.action{background:#f0f0f2;font-size:24px}
.confirm-btn{width:100%;padding:20px;border-radius:18px;background:#22c55e;color:#fff;border:none;font-weight:800;font-size:17px;cursor:pointer;transition:.15s}
.confirm-btn:disabled{opacity:.3;cursor:not-allowed;background:#ccc}
.confirm-btn:active:not(:disabled){transform:scale(.98)}
.error{color:#ef4444;font-size:14px;margin-top:14px;text-align:center;font-weight:600;min-height:20px}
.t-top{background:#111;color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.t-top h2{font-size:17px;font-weight:800;flex:1}
.t-top span{font-size:13px;background:#22c55e;color:#fff;padding:5px 12px;border-radius:99px;font-weight:700}
.icon-btn{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:10px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.icon-btn:active{background:rgba(255,255,255,.2);transform:scale(.95)}
.t-stats{display:flex;gap:10px;padding:14px 18px;background:#fff;border-bottom:1px solid #e5e5e5}
.stat{flex:1;background:#f5f5f7;border-radius:14px;padding:10px;text-align:center}
.stat b{font-size:22px;display:block}
.stat i{font-size:12px;color:#888;font-style:normal}
.connection-badge{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#ef4444;color:#fff;padding:6px 14px;border-radius:99px;font-size:12px;font-weight:700;z-index:200;display:none;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.connection-badge.show{display:block}
.connection-badge.syncing{background:#f59e0b}
.connection-badge.synced{background:#22c55e}
.cards{padding:16px 18px 100px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.cards{grid-template-columns:1fr}}
.card{background:#fff;border:1.5px solid #e5e5e5;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:.2s;position:relative}
.card.ready{border-color:#22c55e;background:#f0fdf4}
.card.pending{border-color:#f59e0b}
.card.pending::after{content:'EN ATTENTE';position:absolute;top:8px;right:8px;background:#f59e0b;color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.05em}
.card-header{display:flex;justify-content:space-between;align-items:center}
.card-num{font-family:'JetBrains Mono',monospace;font-size:26px;font-weight:700}
.badge{font-size:12px;padding:5px 10px;border-radius:99px;font-weight:700;background:#111;color:#fff}
.badge.ready{background:#22c55e}
.card-timer{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:#888;text-align:center;padding:4px;letter-spacing:.05em}
.card-timer.warn{color:#f59e0b}
.card-timer.danger{color:#ef4444}
.card-meta{font-size:12px;color:#888;text-align:center}
.btn-ready{width:100%;padding:13px;border-radius:14px;border:none;font-weight:800;font-size:14px;cursor:pointer;transition:.15s}
.btn-ready.idle{background:#111;color:#fff}
.btn-ready.idle:active{background:#000;transform:translateY(-1px)}
.btn-ready.done{background:#22c55e;color:#fff}
.btn-undo{background:#fff;border:1px solid #e5e5e5;padding:10px;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;width:100%}
.add-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e5e5;padding:12px 18px;display:flex;justify-content:center;box-shadow:0 -4px 20px rgba(0,0,0,.06);z-index:10}
.add-bar button{width:100%;max-width:500px;padding:16px;border-radius:16px;background:#111;color:#fff;border:none;font-weight:800;cursor:pointer;font-size:16px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#f5f5f7;border-radius:24px 24px 0 0;padding:20px;width:100%;max-width:560px;animation:slideUp .2s ease;max-height:95vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h3{font-size:18px;font-weight:800;text-align:center;margin-bottom:8px}
.modal .auto-suggest{text-align:center;font-size:13px;color:#22c55e;font-weight:700;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.modal .auto-suggest button{background:#22c55e;color:#fff;border:none;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:700;cursor:pointer}
.modal .display{background:#fff;border:2px solid #e5e5e5;border-radius:16px;padding:14px;text-align:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:42px;letter-spacing:.2em;margin-bottom:16px;min-height:76px;display:flex;align-items:center;justify-content:center;color:#111}
.modal .display.empty{color:#ccc}
.modal-actions{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.modal-actions .row{display:flex;gap:10px}
.btn-modal{flex:1;padding:16px;border-radius:16px;border:none;font-weight:800;font-size:15px;cursor:pointer;transition:.15s}
.btn-modal.cancel{background:#fff;border:1.5px solid #e5e5e5;color:#111}
.btn-modal.prep{background:#111;color:#fff}
.btn-modal.ready{background:#22c55e;color:#fff;flex:2}
.btn-modal:disabled{opacity:.3;cursor:not-allowed}
.btn-modal:active:not(:disabled){transform:scale(.98)}
.confirm-modal{background:#fff;border-radius:24px;padding:24px;width:90%;max-width:400px;margin:auto}
.confirm-modal h3{font-size:20px;font-weight:900;margin-bottom:12px;text-align:center}
.confirm-modal p{color:#666;font-size:14px;margin-bottom:20px;text-align:center;line-height:1.5}
.confirm-modal .buttons{display:flex;gap:10px}
.confirm-modal .buttons button{flex:1;padding:16px;border-radius:14px;border:none;font-weight:800;font-size:15px;cursor:pointer}
.confirm-modal .buttons .cancel{background:#f0f0f2;color:#111}
.confirm-modal .buttons .danger{background:#ef4444;color:#fff}
.modal-overlay.center{align-items:center}
</style>
</head>
<body>

<div class="connection-badge" id="connBadge">Hors ligne</div>

<div class="pairing" id="pairingView">
  <h1>[H] Hocine Chapati</h1>
  <p>Entrez le code affiche sur la TV</p>
  <div class="code-boxes" id="codeBoxes">
    <div class="code-box" data-idx="0"></div>
    <div class="code-box" data-idx="1"></div>
    <div class="code-box" data-idx="2"></div>
    <div class="code-box" data-idx="3"></div>
  </div>
  <div class="numpad" id="numpadCode">
    <button type="button" onclick="padPress('1')">1</button>
    <button type="button" onclick="padPress('2')">2</button>
    <button type="button" onclick="padPress('3')">3</button>
    <button type="button" onclick="padPress('4')">4</button>
    <button type="button" onclick="padPress('5')">5</button>
    <button type="button" onclick="padPress('6')">6</button>
    <button type="button" onclick="padPress('7')">7</button>
    <button type="button" onclick="padPress('8')">8</button>
    <button type="button" onclick="padPress('9')">9</button>
    <button type="button" class="action" onclick="padClear()">C</button>
    <button type="button" onclick="padPress('0')">0</button>
    <button type="button" class="action" onclick="padBack()">X</button>
  </div>
  <div style="margin-top:14px">
    <button type="button" class="confirm-btn" id="connectBtn" disabled onclick="tryConnect()">Se connecter</button>
  </div>
  <div class="error" id="errorMsg"></div>
</div>

<div id="mainView" class="hidden">
  <div class="t-top">
    <h2>PASSE</h2>
    <span id="countReady">0 prete</span>
    <button class="icon-btn" onclick="openResetConfirm()" title="Reset journee">&#x21BB;</button>
  </div>
  <div class="t-stats">
    <div class="stat"><b id="sEnCours">0</b><i>En cours</i></div>
    <div class="stat"><b id="sPretes" style="color:#22c55e">0</b><i>Pretes</i></div>
    <div class="stat"><b id="sStatus" style="color:#22c55e">*</b><i id="sStatusText">Connecte</i></div>
  </div>
  <div class="cards" id="cards"></div>
  <div class="add-bar">
    <button type="button" onclick="openAddModal()">+ Ajouter un ticket</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io({ reconnection: true, reconnectionDelay: 1000, reconnectionDelayMax: 5000, reconnectionAttempts: Infinity });
let tickets = {};
let readyTimes = {};
let currentCode = '';
let savedCode = localStorage.getItem('hc_tablet_code') || '';
let isOnline = false;
let lastNumber = parseInt(localStorage.getItem('hc_last_number') || '0', 10);

let pendingQueue = JSON.parse(localStorage.getItem('hc_pending_queue') || '[]');

function savePendingQueue() {
  localStorage.setItem('hc_pending_queue', JSON.stringify(pendingQueue));
}

function enqueueUpdate(data) {
  pendingQueue.push({ type: 'update-tickets', data, timestamp: Date.now() });
  savePendingQueue();
  updatePendingBadge();
}

function flushPendingQueue() {
  if (!isOnline || pendingQueue.length === 0) return;
  console.log('[PASSE] Envoi de ' + pendingQueue.length + ' element(s) en attente');
  const badge = document.getElementById('connBadge');
  badge.classList.add('show', 'syncing');
  badge.textContent = 'Synchronisation...';

  socket.emit('tablet:update-tickets', { tickets });
  pendingQueue = [];
  savePendingQueue();
  updatePendingBadge();

  setTimeout(() => {
    badge.classList.remove('syncing');
    badge.classList.add('synced');
    badge.textContent = 'Synchronise';
    setTimeout(() => {
      badge.classList.remove('synced', 'show');
    }, 1500);
  }, 300);
}

function updatePendingBadge() {
  const badge = document.getElementById('connBadge');
  if (!isOnline && pendingQueue.length > 0) {
    badge.textContent = 'Hors ligne - ' + pendingQueue.length + ' en attente';
    badge.classList.add('show');
    badge.classList.remove('syncing', 'synced');
  } else if (!isOnline) {
    badge.textContent = 'Hors ligne';
    badge.classList.add('show');
    badge.classList.remove('syncing', 'synced');
  }
}

function updateCodeDisplay() {
  const boxes = document.querySelectorAll('.code-box');
  boxes.forEach((b, i) => {
    b.textContent = i < currentCode.length ? currentCode[i] : '';
    b.classList.remove('active', 'filled');
    if (i < currentCode.length) b.classList.add('filled');
    if (i === currentCode.length && currentCode.length < 4) b.classList.add('active');
  });
  const btn = document.getElementById('connectBtn');
  if (btn) btn.disabled = currentCode.length !== 4;
  document.getElementById('errorMsg').textContent = '';
}

function padPress(n) {
  if (currentCode.length >= 4) return;
  currentCode += n;
  updateCodeDisplay();
  vibrate(10);
  if (currentCode.length === 4) setTimeout(tryConnect, 300);
}
function padClear() { currentCode = ''; updateCodeDisplay(); vibrate(10); }
function padBack() { currentCode = currentCode.slice(0, -1); updateCodeDisplay(); vibrate(10); }

function tryConnect() {
  if (currentCode.length !== 4) return;
  socket.emit('tablet:connect', { code: currentCode });
}

socket.on('connect', () => {
  console.log('[PASSE] Connecte');
  isOnline = true;
  document.getElementById('connBadge').classList.remove('show');
  if (savedCode) socket.emit('tablet:connect', { code: savedCode });
});

socket.on('disconnect', () => {
  console.log('[PASSE] Deconnecte');
  isOnline = false;
  updateStatus(false);
  updatePendingBadge();
});

socket.on('connect_error', () => {
  isOnline = false;
  updateStatus(false);
  updatePendingBadge();
});

socket.on('tablet:connected', ({ tickets: t, lastNumber: ln }) => {
  savedCode = currentCode || savedCode;
  localStorage.setItem('hc_tablet_code', savedCode);

  if (pendingQueue.length === 0) {
    tickets = t || {};
    if (ln !== undefined && ln > lastNumber) {
      lastNumber = ln;
      localStorage.setItem('hc_last_number', String(lastNumber));
    }
  }

  socket.emit('tablet:request-ready-times');
  document.getElementById('pairingView').classList.add('hidden');
  document.getElementById('mainView').classList.remove('hidden');
  updateStatus(true);
  render();

  if (pendingQueue.length > 0) flushPendingQueue();
});

socket.on('tablet:ready-times', (rt) => {
  readyTimes = rt || {};
  render();
});

socket.on('tablet:error', (msg) => {
  if (document.getElementById('mainView').classList.contains('hidden')) {
    document.getElementById('errorMsg').textContent = msg;
    currentCode = '';
    savedCode = '';
    localStorage.removeItem('hc_tablet_code');
    updateCodeDisplay();
    vibrate([50, 30, 50]);
  }
});

socket.on('tablet:day-reset', () => {
  tickets = {};
  readyTimes = {};
  lastNumber = 0;
  localStorage.setItem('hc_last_number', '0');
  render();
  showToast('Journee reinitialisee');
});

function updateStatus(online) {
  const statusEl = document.getElementById('sStatus');
  const textEl = document.getElementById('sStatusText');
  if (!statusEl) return;
  if (online) {
    statusEl.style.color = '#22c55e';
    textEl.textContent = 'Connecte';
  } else {
    statusEl.style.color = '#ef4444';
    textEl.textContent = 'Hors ligne';
  }
}

function vibrate(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

/* ============ MODALE AJOUT ============ */
let modalCode = '';

function openAddModal() {
  // Pre-remplir avec le prochain numero
  modalCode = String(lastNumber + 1);
  const suggested = lastNumber + 1;

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modalOverlay';
  let numpadHTML = '';
  for (let i = 1; i <= 9; i++) numpadHTML += '<button type="button" data-num="' + i + '">' + i + '</button>';
  numpadHTML += '<button type="button" data-action="clear">C</button>';
  numpadHTML += '<button type="button" data-num="0">0</button>';
  numpadHTML += '<button type="button" data-action="back">X</button>';
  overlay.innerHTML = '<div class="modal">' +
    '<h3>Numero du ticket</h3>' +
    '<div class="auto-suggest">Suggestion auto : #' + suggested + ' <button type="button" id="autoSuggest">Reprendre</button></div>' +
    '<div class="display" id="modalDisplay">' + modalCode + '</div>' +
    '<div class="numpad" id="modalNumpad">' + numpadHTML + '</div>' +
    '<div class="modal-actions"><div class="row">' +
      '<button type="button" id="modalCancel" class="btn-modal cancel">Annuler</button>' +
      '<button type="button" id="modalAddPrep" class="btn-modal prep">En cours</button>' +
      '<button type="button" id="modalAddReady" class="btn-modal ready">AJOUTER PRET</button>' +
    '</div></div></div>';
  document.body.appendChild(overlay);
  document.querySelectorAll('#modalNumpad button').forEach(btn => {
    btn.addEventListener('click', () => {
      const num = btn.getAttribute('data-num');
      const action = btn.getAttribute('data-action');
      if (num !== null) modalPad(num);
      else if (action === 'clear') modalClear();
      else if (action === 'back') modalBack();
    });
  });
  document.getElementById('modalCancel').addEventListener('click', closeAddModal);
  document.getElementById('modalAddPrep').addEventListener('click', () => confirmAddModal('prep'));
  document.getElementById('modalAddReady').addEventListener('click', () => confirmAddModal('ready'));
  document.getElementById('autoSuggest').addEventListener('click', () => {
    modalCode = String(suggested);
    updateModalDisplay();
    vibrate(10);
  });
  updateModalDisplay();
}

function updateModalDisplay() {
  const display = document.getElementById('modalDisplay');
  if (!display) return;
  if (modalCode.length === 0) { display.textContent = '----'; display.classList.add('empty'); }
  else { display.textContent = modalCode; display.classList.remove('empty'); }
  const hasValue = modalCode.length > 0;
  ['modalAddPrep', 'modalAddReady'].forEach(id => {
    const btn = document.getElementById(id);
    if (btn) { btn.disabled = !hasValue; btn.style.opacity = hasValue ? '1' : '.3'; }
  });
}
function modalPad(n) { if (modalCode.length >= 4) return; modalCode += n; updateModalDisplay(); vibrate(10); }
function modalClear() { modalCode = ''; updateModalDisplay(); vibrate(10); }
function modalBack() { modalCode = modalCode.slice(0, -1); updateModalDisplay(); vibrate(10); }
function closeAddModal() { const o = document.getElementById('modalOverlay'); if (o) o.remove(); }

function confirmAddModal(status) {
  const n = parseInt(modalCode, 10);
  if (!n || tickets[n]) { alert('Numero invalide ou deja existant'); modalClear(); return; }
  tickets[n] = status;
  if (n > lastNumber) {
    lastNumber = n;
    localStorage.setItem('hc_last_number', String(lastNumber));
  }
  syncTickets();
  render();
  closeAddModal();
  if (status === 'ready') beep();
}

/* ============ RESET JOURNEE ============ */
function openResetConfirm() {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay center';
  overlay.id = 'resetOverlay';
  overlay.innerHTML = '<div class="confirm-modal">' +
    '<h3>Reinitialiser la journee ?</h3>' +
    '<p>Tous les tickets en cours et prets seront supprimes. Cette action est irreversible.</p>' +
    '<div class="buttons">' +
      '<button type="button" class="cancel" id="resetCancel">Annuler</button>' +
      '<button type="button" class="danger" id="resetConfirm">Reinitialiser</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(overlay);
  document.getElementById('resetCancel').addEventListener('click', () => overlay.remove());
  document.getElementById('resetConfirm').addEventListener('click', () => {
    overlay.remove();
    // Reset local
    tickets = {};
    readyTimes = {};
    lastNumber = 0;
    localStorage.setItem('hc_last_number', '0');
    pendingQueue = [];
    savePendingQueue();
    render();
    // Envoyer au serveur
    socket.emit('tablet:reset-day');
    showToast('Journee reinitialisee');
  });
}

function showToast(msg) {
  const t = document.createElement('div');
  t.style.cssText = 'position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:12px 20px;border-radius:99px;font-size:14px;font-weight:700;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.2)';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function syncTickets() {
  if (isOnline && socket.connected) {
    socket.emit('tablet:update-tickets', { tickets });
  } else {
    enqueueUpdate({ tickets });
  }
}

/* ============ RENDU ============ */
function formatTime(ms) {
  if (!ms || ms < 0) return '00:00';
  const totalSec = Math.floor(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  if (m >= 60) {
    const h = Math.floor(m / 60);
    const mm = m % 60;
    return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}
function getTimerClass(ms) {
  const sec = Math.floor(ms / 1000);
  if (sec < 120) return '';
  if (sec < 300) return 'warn';
  return 'danger';
}

function render() {
  const cards = document.getElementById('cards');
  cards.innerHTML = '';
  const isPending = !isOnline && pendingQueue.length > 0;
  Object.keys(tickets).sort((a, b) => a - b).forEach(num => {
    const st = tickets[num];
    const div = document.createElement('div');
    div.className = 'card' + (st === 'ready' ? ' ready' : '') + (isPending ? ' pending' : '');
    const elapsed = (st === 'ready' && readyTimes[num]) ? Date.now() - readyTimes[num] : 0;
    const timerTxt = (st === 'ready' && readyTimes[num]) ? formatTime(elapsed) : '';
    const timerCls = (st === 'ready' && readyTimes[num]) ? getTimerClass(elapsed) : '';
    div.innerHTML = '<div class="card-header">' +
        '<div class="card-num">#' + num + '</div>' +
        '<span class="badge ' + (st === 'ready' ? 'ready' : '') + '">' + (st === 'ready' ? 'PRETE' : 'EN COURS') + '</span>' +
      '</div>' +
      (timerTxt ? '<div class="card-timer ' + timerCls + '" data-num="' + num + '">' + timerTxt + '</div>' : '') +
      '<div class="card-meta">' + (st === 'ready' ? 'Au passe' : 'En preparation') + '</div>' +
      (st === 'prep'
        ? '<button class="btn-ready idle" onclick="setReady(' + num + ')">PRET</button>'
        : '<button class="btn-ready done" onclick="setRetrieved(' + num + ')">RECUPERE - Retirer</button>' +
          '<button class="btn-undo" onclick="setPrep(' + num + ')">Remettre en cours</button>'
      );
    cards.appendChild(div);
  });
  const readyList = Object.keys(tickets).filter(k => tickets[k] === 'ready');
  document.getElementById('sEnCours').textContent = Object.keys(tickets).length - readyList.length;
  document.getElementById('sPretes').textContent = readyList.length;
  document.getElementById('countReady').textContent = readyList.length + ' prete' + (readyList.length !== 1 ? 's' : '');
}

function updateTimers() {
  document.querySelectorAll('.card-timer').forEach(el => {
    const num = el.dataset.num;
    if (readyTimes[num]) {
      const elapsed = Date.now() - readyTimes[num];
      el.textContent = formatTime(elapsed);
      el.className = 'card-timer ' + getTimerClass(elapsed);
    }
  });
}
setInterval(updateTimers, 1000);

function setReady(n) { tickets[n] = 'ready'; syncTickets(); render(); beep(); vibrate(20); }
function setPrep(n) { tickets[n] = 'prep'; syncTickets(); render(); }
function setRetrieved(n) { delete tickets[n]; syncTickets(); render(); }

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(.15, ctx.currentTime);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + .35); o.stop(ctx.currentTime + .36);
  } catch (e) {}
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}

updateCodeDisplay();
</script>
